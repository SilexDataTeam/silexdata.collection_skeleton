# Check-mode tests for this module.
#
# These are written assuming the module supports check mode: a read-only
# call must run in check mode and report no changes. They are intentionally
# NOT conditional on the module's current check-mode support -- if the module
# does not declare supports_check_mode, Ansible skips it and these assertions
# fail by design, surfacing the missing check-mode support.
#
# TODO: replace the module FQCN and parameters below with your real module
# and a read-only invocation of it.

- name: "Check-mode | TODO: run a read-only call in check mode"
  # <namespace>.<collection_name>.your_module_name:
  #   ...your real parameters...
  ansible.builtin.debug:
    msg: "TODO: replace this task with a real check-mode invocation of your module."
  check_mode: true
  register: example_module_check_mode
  ignore_errors: true

- name: Check-mode | Assert the module ran in check mode and made no changes
  ansible.builtin.assert:
    that:
      - example_module_check_mode is not skipped
      - example_module_check_mode is not failed
      - example_module_check_mode is not changed
    fail_msg: >-
      Module did not run correctly in check mode. The module must declare
      supports_check_mode=True and make no changes when run in check mode.
    success_msg: "Module supports check mode and reported no changes."
