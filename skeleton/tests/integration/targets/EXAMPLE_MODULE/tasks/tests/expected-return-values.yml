# Live (service-dependent) tests: validate the data the real service actually
# returns. These require a reachable service, so the whole block is skipped
# when the setup_<collection_name> role (see setup_EXAMPLE/) reports the
# service as unavailable. In that case setup_<collection_name> has already
# emitted a warning (or failed the run, if
# setup_<collection_name>_require_service is enabled).
#
# TODO: replace the module FQCN, parameters, and assertions below with a real,
# read-only call against your module and the fields it actually returns.

- name: Expected-return-values | Live API response checks
  when: example_module_service_available | bool
  block:
    - name: "Expected-return-values | TODO: make a real read-only call"
      # <namespace>.<collection_name>.your_module_name:
      #   ...your real parameters...
      ansible.builtin.debug:
        msg: "TODO: replace this task with a real invocation of your module."
      register: example_module_result

    - name: Expected-return-values | Assert the response shape
      ansible.builtin.assert:
        that:
          - example_module_result is not failed
          - example_module_result is not changed
        fail_msg: "Unexpected response from the service: {{ example_module_result }}"
        success_msg: "Service returned the expected response shape."
