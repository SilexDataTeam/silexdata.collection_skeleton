---
# SPDX-FileCopyrightText: Silex Data Solutions
# SPDX-License-Identifier: Apache-2.0
name: Reusable Docs

# Builds the antsibull-docs Sphinx docsite for the calling collection and
# deploys it to GitHub Pages, alongside the HTML coverage report built by
# reusable-coverage.yml (fetched via the wait-for-workflow-artifact composite
# action, since deploy-pages accepts only one artifact per deployment).
#
# Runs on every push/PR to catch docs build breakage early; the HTML artifact
# itself is only kept, and Pages only deployed, on pushes to the default
# branch. The docs job also waits on the coverage workflow's run for the same
# commit to generate a native coverage summary page, so every docs build - not
# just pushes to main - reflects that exact commit.
#
# Called by a collection repo's own .github/workflows/docs.yml, e.g.
#
#   jobs:
#     docs:
#       uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-docs.yml@v1
#
# The caller must have already run (or be concurrently running) the coverage
# workflow for the same commit, since this waits on its coverage-html artifact.
#
# NOTE: the two composite actions below are referenced at a hardcoded @v1.
# `uses:` accepts no expressions, so a cross-repo action reference can never be
# computed - when this workflow is cut as v2, bump those two refs to match.
on:
  workflow_call:
    inputs:
      coverage-workflow:
        description: Filename of the caller's coverage workflow to wait on.
        required: false
        type: string
        default: coverage.yml
      ansible-core-version:
        description: ansible-core version used to build the docsite.
        required: false
        type: string
        default: "2.21"
      python-version:
        description: Python version used to build the docsite.
        required: false
        type: string
        default: "3.12"
      deploy:
        description: >-
          Whether to deploy to GitHub Pages. Deployment additionally requires
          the run to be a push to the default branch.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect collection namespace/name
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.galaxy.outputs.namespace }}
      name: ${{ steps.galaxy.outputs.name }}
    steps:
      - name: Check out collection
        uses: actions/checkout@v7

      - name: Read namespace/name from galaxy.yml
        id: galaxy
        run: |
          namespace=$(grep -m1 '^namespace:' galaxy.yml | awk '{print $2}')
          name=$(grep -m1 '^name:' galaxy.yml | awk '{print $2}')
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

  docs:
    needs: detect
    name: Build collection documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # antsibull-docs sphinx-init auto-detects the collection from its
      # working directory (the collection root), but build.sh's own
      # antsibull-docs/ansible-doc invocation runs one directory deeper, in
      # docsbuild/, where that auto-detection no longer applies. Point
      # ansible-doc at the checkout root explicitly so --use-current can
      # still find the in-place collection instead of requiring it to be
      # installed.
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    steps:
      - name: Check out collection
        uses: actions/checkout@v7
        with:
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ansible-core and antsibull-docs
        run: python -m pip install "ansible-core~=${{ inputs.ansible-core-version }}.0" antsibull-docs

      # The coverage workflow runs on the same push/PR triggers as this one,
      # so its run for this commit may still be in progress;
      # wait-for-workflow-artifact polls until that exact commit's run
      # completes. github.sha is wrong here for pull_request events - it's the
      # synthetic merge commit on refs/pull/N/merge, which never matches a
      # workflow run's real head_sha, so this would poll until timeout. Use
      # the PR's actual head commit for pull_request events, falling back to
      # github.sha for push/workflow_dispatch, where it's already correct.
      - name: Wait for coverage report
        uses: SilexDataTeam/silexdata.collection_skeleton/.github/actions/wait-for-workflow-artifact@v1
        with:
          workflow: ${{ inputs.coverage-workflow }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          artifact-name: coverage-html
          path: coverage-html
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage summary page
        uses: SilexDataTeam/silexdata.collection_skeleton/.github/actions/coverage-summary@v1
        with:
          report-index: ${{ github.workspace }}/coverage-html/index.html
          working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}

      # --squash-hierarchy flattens the site for a single collection. The
      # cross-collection aggregator site deliberately omits it so antsibull-docs
      # emits the shared index plus per-collection subtrees instead.
      - name: Generate Sphinx docsite project
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}
        run: |
          mkdir -p docsbuild
          antsibull-docs sphinx-init --use-current --squash-hierarchy \
            --dest-dir docsbuild ${{ needs.detect.outputs.namespace }}.${{ needs.detect.outputs.name }}

      - name: Build HTML docsite
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}/docsbuild
        run: |
          python -m pip install -r requirements.txt
          ./build.sh

      - name: Upload documentation site artifact
        if: inputs.deploy && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}/docsbuild/build/html
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [detect, docs]
    if: inputs.deploy && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push'
    name: Deploy docs + coverage report to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Assemble a single site: the docsite at the root, and the coverage
      # report (built by the separate coverage workflow) nested under
      # /coverage/, since deploy-pages publishes exactly one artifact per
      # deployment. The coverage workflow triggers on the same push, so its
      # run for this commit may still be in progress (or not yet started) when
      # this step runs; wait-for-workflow-artifact polls until that exact
      # commit's run completes rather than grabbing whatever the latest
      # successful run on the branch happens to be, so the deployed report
      # always matches this commit and this job fails loudly instead of racing
      # ahead of a coverage run that hasn't produced its artifact yet.
      - name: Download documentation site
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: site

      # This job only ever runs for push events (see the job-level if:
      # above), where github.sha is already the real commit - the fallback
      # expression is only load-bearing in the docs job's identical step,
      # kept here too so both stay in sync.
      - name: Wait for coverage report
        uses: SilexDataTeam/silexdata.collection_skeleton/.github/actions/wait-for-workflow-artifact@v1
        with:
          workflow: ${{ inputs.coverage-workflow }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          artifact-name: coverage-html
          path: site/coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload combined site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
