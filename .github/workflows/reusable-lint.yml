name: Reusable Lint

# Runs the collection's pre-commit suite (ruff, yamllint, pymarkdown,
# ansible-lint, antsibull-changelog, actionlint, antsibull-docs, and the
# build-import check) against every file in the calling repository.
#
# Called by a collection repo's own .github/workflows/lint.yml, e.g.
#
#   jobs:
#     lint:
#       uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-lint.yml@v1
#
# Nothing here is collection-specific: the behaviour is driven entirely by the
# caller's .pre-commit-config.yaml, so a collection tunes its linting there
# rather than by passing inputs.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run pre-commit.
        required: false
        type: string
        default: "3.14"

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
