---
# SPDX-FileCopyrightText: Silex Data Solutions
# SPDX-License-Identifier: Apache-2.0
name: Selfcheck

# Proves this repository still works as an ansible-galaxy collection skeleton.
#
# Without this, the skeleton rots silently: nothing else in CI ever actually
# runs `ansible-galaxy collection init` against skeleton/, so a broken Jinja
# template or a stale caller workflow would only surface the next time someone
# created a collection from it.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcheck:
    name: Generate a collection from skeleton/ and lint it
    # The inverse of the guard on the caller workflows: this one is only
    # meaningful in the template repository itself.
    if: github.repository == 'SilexDataTeam/silexdata.collection_skeleton'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install ansible-core pre-commit yamllint reuse nox antsibull-nox

      # The caller workflows are deliberately duplicated: the copies at the
      # repo root arrive in a new repo via the GitHub template copy, and the
      # copies under skeleton/ serve a standalone `ansible-galaxy collection
      # init`. bootstrap.yml relies on them being byte-identical - if they
      # drift, its rsync would try to modify .github/workflows/, which
      # GITHUB_TOKEN is not allowed to push.
      # The reverse direction matters too. Anything in .github/workflows/
      # without a payload twin survives bootstrap into every generated repo,
      # because GITHUB_TOKEN cannot delete it - so every such file must be a
      # known template-only workflow. This keeps bootstrap.yml's printed
      # cleanup command complete.
      #
      # The allow-list below is duplicated in bootstrap.yml's "Next steps"
      # cleanup command; change both together.
      - name: Assert caller workflows match the payload copies
        env:
          TEMPLATE_ONLY: bootstrap.yml refresh-galaxy-token.yml selfcheck.yml
        run: |
          rc=0
          for f in skeleton/.github/workflows/*.yml; do
            base=$(basename "$f")
            if ! cmp -s "$f" ".github/workflows/${base}"; then
              echo "::error file=${f}::${base} differs between skeleton/.github/workflows/ and .github/workflows/"
              rc=1
            fi
          done
          for f in .github/workflows/*.yml; do
            base=$(basename "$f")
            [ -f "skeleton/.github/workflows/${base}" ] && continue
            case " ${TEMPLATE_ONLY} " in
              *" ${base} "*) ;;
              *)
                echo "::error file=${f}::${base} has no payload twin and is not template-only; it would leak into every generated collection."
                echo "Add it to skeleton/.github/workflows/, or to TEMPLATE_ONLY here and to bootstrap.yml's cleanup command."
                rc=1
                ;;
            esac
          done
          exit $rc

      - name: Generate a collection from the skeleton
        run: |
          cat > /tmp/vars.json <<'JSON'
          {
            "namespace": "silexdata",
            "collection_name": "selfcheck",
            "description": "Generated by the collection_skeleton selfcheck's workflow.",
            "authors": ["Silex Data Solutions <info@silexdata.com>", "Silex Data Solutions (@SilexDataTeam)"],
            "repository": "https://github.com/SilexDataTeam/silexdata.selfcheck",
            "issues": "https://github.com/SilexDataTeam/silexdata.selfcheck/issues",
            "homepage": "https://www.silexdata.com/",
            "documentation": "https://galaxy.ansible.com/ui/repo/published/silexdata/selfcheck/docs/"
          }
          JSON
          ansible-galaxy collection init silexdata.selfcheck \
            --collection-skeleton skeleton \
            --init-path /tmp/generated \
            -e @/tmp/vars.json

      - name: Assert the generated tree is well formed
        working-directory: /tmp/generated/silexdata/selfcheck
        run: |
          rc=0

          # Nothing should still be a Jinja template. .j2 files are only legal
          # under roles/*/templates and playbooks/*/templates, which
          # ansible-galaxy copies verbatim as payload for the collection's own
          # users.
          leftover=$(find . -name '*.j2' -not -path './roles/*/templates/*' -not -path './playbooks/*/templates/*')
          if [ -n "$leftover" ]; then
            echo "::error::Unrendered .j2 files in the generated collection:"
            echo "$leftover"
            rc=1
          fi

          # Regression test for the .git_keep bug: ansible-galaxy's default
          # skeleton-ignore drops files named .git_keep, so the directories
          # they were meant to preserve arrived empty and vanished on first
          # clone. .gitkeep is not ignored, so it survives.
          for d in changelogs/fragments roles; do
            if [ ! -f "$d/.gitkeep" ]; then
              echo "::error::Missing $d/.gitkeep - empty directory will not survive a clone."
              rc=1
            fi
          done

          for required in galaxy.yml meta/runtime.yml README.md COPYING REUSE.toml \
                          LICENSES/Apache-2.0.txt .claude/CLAUDE.md \
                          docs/docsite/links.yml docs/docsite/rst/coverage-report.rst \
                          .github/workflows/lint.yml; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing $required in the generated collection."
              rc=1
            fi
          done

          # The Sync Claude rules workflow keeps .claude/ an exact mirror of
          # skeleton/.claude/ apart from CLAUDE.md. A fresh collection must
          # already be one, or its first scheduled sync would open a PR.
          if ! drift=$(diff -r -x CLAUDE.md -x CLAUDE.md.j2 \
            "${GITHUB_WORKSPACE}/skeleton/.claude" .claude); then
            echo "::error::A generated .claude/ is not a mirror of skeleton/.claude/:"
            echo "$drift"
            rc=1
          fi

          exit $rc

      - name: Validate generated galaxy.yml
        working-directory: /tmp/generated/silexdata/selfcheck
        run: |
          python3 - <<'PY'
          import json
          import sys

          import yaml

          with open("galaxy.yml") as fh:
              galaxy = yaml.safe_load(fh)

          errors = []
          if galaxy.get("namespace") != "silexdata":
              errors.append(f"namespace is {galaxy.get('namespace')!r}, expected 'silexdata'")
          if galaxy.get("name") != "selfcheck":
              errors.append(f"name is {galaxy.get('name')!r}, expected 'selfcheck'")
          # The release workflow bumps relative to this value and holds all
          # releases below 1.0.0, so a new collection must start at 0.0.1 for
          # its first release to be exactly 1.0.0.
          # bootstrap.yml passes these as extra vars; a template that
          # hardcodes its own values would silently discard them. The inputs
          # above deliberately include an apostrophe and two authors, to catch
          # quoting that breaks the YAML and a loop that renders only one.
          # Both authors are the company's real identity - its address and its
          # GitHub org - never invented people. As a two-entry list they differ
          # from the template's single-author fallback, so a template that
          # ignores them still fails.
          expect = json.load(open("/tmp/vars.json"))
          for key in ("description", "authors", "repository", "issues", "homepage", "documentation"):
              if galaxy.get(key) != expect[key]:
                  errors.append(f"{key} is {galaxy.get(key)!r}, but bootstrap passed {expect[key]!r}")
          readme = open("README.md").read()
          if expect["description"] not in readme:
              errors.append("README.md does not contain the description bootstrap passed")
          if str(galaxy.get("version")) != "0.0.1":
              errors.append(f"version is {galaxy.get('version')!r}, expected '0.0.1'")
          # galaxy-importer rejects a galaxy.yml that sets both.
          if galaxy.get("license") and galaxy.get("license_file"):
              errors.append("'license' and 'license_file' are mutually exclusive")
          if not galaxy.get("license") and not galaxy.get("license_file"):
              errors.append("one of 'license' or 'license_file' must be set")
          if "example.com" in yaml.safe_dump(galaxy):
              errors.append("placeholder example.com URLs survived templating")

          for err in errors:
              print(f"::error file=galaxy.yml::{err}")
          sys.exit(1 if errors else 0)
          PY

      - name: Lint the generated collection
        working-directory: /tmp/generated/silexdata/selfcheck
        run: yamllint --strict .

      # Run the collection's real license-check nox session, not just
      # `reuse lint`. The session has two halves and they disagree about what
      # counts: `reuse lint` honours REUSE.toml, while antsibull-nox's own
      # check reads per-file headers only, so `reuse lint` alone can pass a
      # tree that fails the other half file after file. It needs a git
      # repository to list files.
      - name: Check licensing of the generated collection
        working-directory: /tmp/generated/silexdata/selfcheck
        run: |
          git init -q .
          git add -A
          nox -e license-check

      # Proves the empty directories are actually tracked - git cannot store
      # an empty directory, which is the whole point of the .gitkeep check.
      - name: Assert the generated collection is committable
        working-directory: /tmp/generated/silexdata/selfcheck
        run: |
          git init -q . 2>/dev/null || true
          git add -A
          for d in changelogs/fragments roles; do
            if ! git ls-files --error-unmatch "$d/.gitkeep" >/dev/null 2>&1; then
              echo "::error::$d/.gitkeep is not tracked by git."
              exit 1
            fi
          done

      - name: Build the generated collection
        working-directory: /tmp/generated/silexdata/selfcheck
        run: ansible-galaxy collection build --output-path /tmp/dist

      # build_ignore must keep the Claude rules and CI config out of the
      # published artifact.
      - name: Assert excluded paths are absent from the artifact
        run: |
          rc=0
          tarball=$(find /tmp/dist -name '*.tar.gz' | head -n1)
          echo "Inspecting ${tarball}"
          contents=$(tar tzf "$tarball")
          for unwanted in '.claude' '.github' 'pyproject.toml' 'noxfile.py' 'antsibull-nox.toml'; do
            if echo "$contents" | grep -q "^${unwanted}"; then
              echo "::error::${unwanted} was included in the built collection artifact."
              rc=1
            fi
          done
          exit $rc
