---
# SPDX-FileCopyrightText: Silex Data Solutions
# SPDX-License-Identifier: Apache-2.0
name: Reusable skeleton sync

# Keeps a collection's skeleton-managed files exact copies of the skeleton's,
# and proposes any difference as a pull request. The files are the ones listed
# in sync-manifest.txt at the root of the skeleton repository: .claude/ (rules,
# skills and anything added there later) and the tooling configuration that
# every collection shares verbatim. A directory's own top-level CLAUDE.md is
# excluded - each collection tailors its .claude/CLAUDE.md.
#
# Anything the manifest lists belongs to the skeleton: a local edit is
# reverted by the next sync, so change it there instead.
#
# Nothing here touches .github/workflows/, so GITHUB_TOKEN may push the sync
# branch. Two GitHub behaviours shape the rest:
#
# - An organization can forbid GitHub Actions from creating pull requests
#   (SilexDataTeam does, so repos cannot opt in). The PR is still attempted;
#   when it is refused, the run warns with a link that opens the PR in one
#   click instead of failing.
# - A PR created or updated through GITHUB_TOKEN gets its CI runs in an
#   approval-required state: a maintainer starts them with "Approve workflows
#   to run" in the PR's merge box. A PR a human opens from the link runs CI
#   straight away.
#
# Called by a collection repo's own .github/workflows/sync-rules.yml, e.g.
#
#   jobs:
#     sync-rules:
#       uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-sync-rules.yml@v1
on:
  workflow_call:
    inputs:
      skeleton-ref:
        description: Ref of silexdata.collection_skeleton to mirror from.
        required: false
        type: string
        default: main
      branch:
        description: Branch the sync is committed to and proposed from.
        required: false
        type: string
        default: sync/skeleton

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync skeleton-managed files
    runs-on: ubuntu-latest
    steps:
      # Resolved here rather than from github.event: a scheduled run's event
      # payload carries no repository object.
      - name: Resolve the default branch
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(gh api "repos/${REPO}" --jq .default_branch)
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      # Always sync from the default branch, whichever ref a manual run was
      # started on, since that is what the PR targets.
      - name: Check out collection
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.branch }}
          fetch-depth: 0

      - name: Check out the collection skeleton
        uses: actions/checkout@v7
        with:
          repository: SilexDataTeam/silexdata.collection_skeleton
          ref: ${{ inputs.skeleton-ref }}
          path: .skeleton-src
          persist-credentials: false
          # Cone mode also brings the root files, sync-manifest.txt among them.
          sparse-checkout: skeleton

      # A directory entry (trailing /) is mirrored with rsync --delete; a file
      # entry is copied. Modes are normalised rather than mirrored, since a
      # template copy never preserves them (ansible-galaxy's copyfile drops
      # them), so only content counts as drift. rsync's excludes are never
      # deleted, which keeps the collection's own CLAUDE.md.
      - name: Mirror the skeleton-managed files
        id: mirror
        env:
          SRC_ROOT: .skeleton-src/skeleton
          MANIFEST: .skeleton-src/sync-manifest.txt
        run: |
          fail() {
            echo "::error title=Cannot sync::$*"
            exit 1
          }
          [ -f "$MANIFEST" ] || fail "The skeleton has no ${MANIFEST#.skeleton-src/} listing the files to sync."
          mapfile -t paths < <(grep -vE '^[[:space:]]*(#|$)' "$MANIFEST" | sed 's/[[:space:]]*$//')
          [ "${#paths[@]}" -gt 0 ] || fail "${MANIFEST#.skeleton-src/} lists nothing to sync."
          for path in "${paths[@]}"; do
            case "$path" in
            /* | *..*) fail "Refusing manifest entry '${path}': it must be relative and stay inside the collection." ;;
            esac
            src="${SRC_ROOT}/${path%/}"
            if [[ "$path" == */ ]]; then
              [ -d "$src" ] || fail "The manifest lists ${path}, but skeleton/${path} is not a directory."
              # Only CLAUDE.md is rendered per collection; any other template
              # here could not be mirrored verbatim.
              templates=$(cd "$src" && find . -name '*.j2' ! -path './CLAUDE.md.j2')
              [ -z "$templates" ] || fail "Cannot mirror Jinja templates from skeleton/${path}: ${templates}"
              mkdir -p "$path"
              rsync -r --delete --checksum --chmod=D755,F644 \
                --exclude=/CLAUDE.md --exclude=/CLAUDE.md.j2 "$src/" "$path"
            else
              [ -f "$src" ] || fail "The manifest lists ${path}, but skeleton/${path} is not a file."
              case "$path" in
              *.j2) fail "Cannot mirror the Jinja template ${path} verbatim." ;;
              esac
              mkdir -p "$(dirname "$path")"
              install -m 644 "$src" "$path"
            fi
          done
          drift=$(git status --porcelain --untracked-files=all -- "${paths[@]%/}")
          if [ -z "$drift" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The skeleton-managed files already match the collection skeleton."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The skeleton-managed files have drifted from the collection skeleton:"
            echo "$drift"
          fi

      # The trivial fragment satisfies the Changelog check without releasing
      # anything. The branch is rebuilt from the default branch every run, and
      # pushed only when that changes it, so an open PR's approved CI runs are
      # not invalidated by an identical re-push.
      - name: Commit the sync to its branch
        id: commit
        if: steps.mirror.outputs.changed == 'true'
        env:
          BRANCH: ${{ inputs.branch }}
          FRAGMENT: changelogs/fragments/sync-skeleton.yml
          MANIFEST: .skeleton-src/sync-manifest.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -C "$BRANCH"
          mkdir -p "$(dirname "$FRAGMENT")"
          # Starts with `---`: the collection's .yamllint requires a document
          # start, and both pre-commit and nox lint fragments with it.
          printf -- '---\ntrivial:\n  - Sync the skeleton-managed files with the collection skeleton.\n' > "$FRAGMENT"
          mapfile -t paths < <(grep -vE '^[[:space:]]*(#|$)' "$MANIFEST" | sed 's/[[:space:]]*$//')
          git add --all -- "${paths[@]%/}" "$FRAGMENT"
          git commit --quiet -m "chore: sync skeleton-managed files with the collection skeleton"
          if git rev-parse --quiet --verify "refs/remotes/origin/${BRANCH}" >/dev/null &&
            git diff --quiet "origin/${BRANCH}" HEAD; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "${BRANCH} already holds this sync."
          else
            git push --quiet --force origin "HEAD:refs/heads/${BRANCH}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed the sync to ${BRANCH}."
          fi

      - name: Open or find the sync PR
        id: pr
        if: steps.mirror.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ steps.base.outputs.branch }}
        run: |
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$existing" ]; then
            echo "url=${existing}" >> "$GITHUB_OUTPUT"
            echo "The sync PR is already open: ${existing}"
            exit 0
          fi
          body="Mirrors the files listed in silexdata.collection_skeleton's \`sync-manifest.txt\` (\`.claude/\` except \`CLAUDE.md\`, and the shared tooling configuration), opened by the skeleton sync workflow. A maintainer must select **Approve workflows to run** before its checks report."
          if out=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
            --title "chore: sync skeleton-managed files with the collection skeleton" --body "$body" 2>&1); then
            echo "url=${out}" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skeleton sync PR opened::${out} - approve its workflow runs from the PR page."
          elif grep -qi "not permitted to create or approve pull requests" <<<"$out"; then
            compare="${SERVER}/${REPO}/compare/${BASE}...${BRANCH}?expand=1"
            echo "url=${compare}" >> "$GITHUB_OUTPUT"
            echo "::warning title=Open the skeleton sync PR::This organization does not let GitHub Actions open pull requests. Open it from ${compare}"
          else
            echo "$out"
            echo "::error::Could not open the skeleton sync PR."
            exit 1
          fi
