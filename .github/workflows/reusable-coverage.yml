---
# SPDX-FileCopyrightText: Silex Data Solutions
# SPDX-License-Identifier: Apache-2.0
name: Reusable Coverage

# Runs ansible-test units + integration with coverage across the ansible-core
# matrix, from the collection's requires_ansible floor upward, then aggregates
# every matrix leg's coverage data into a single report, badge and PR comment.
#
# Called by a collection repo's own .github/workflows/ci.yml, e.g.
#
#   jobs:
#     coverage:
#       uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-coverage.yml@v1
#       with:
#         integration-target: manage_example
#
# The namespace/name are read from the caller's galaxy.yml at run time, so
# nothing here is baked in per collection.
on:
  workflow_call:
    inputs:
      integration-target:
        description: >-
          ansible-test integration target to run. Leave empty to run the whole
          integration suite.
        required: false
        type: string
        default: ""
      ansible-core-matrix:
        description: >-
          JSON list of {ansible, python} pairs to test against. Entries below
          the collection's minimum ansible-core (see min-ansible-core) are
          dropped, so this can stay the full list of supported releases.
        required: false
        type: string
        default: >-
          [{"ansible": "2.14", "python": "3.11"},
           {"ansible": "2.15", "python": "3.11"},
           {"ansible": "2.16", "python": "3.11"},
           {"ansible": "2.17", "python": "3.11"},
           {"ansible": "2.18", "python": "3.11"},
           {"ansible": "2.19", "python": "3.11"},
           {"ansible": "2.20", "python": "3.12"},
           {"ansible": "2.21", "python": "3.12"}]
      min-ansible-core:
        description: >-
          Override the minimum ansible-core version ("X.Y"). Leave empty to
          derive it from requires_ansible in meta/runtime.yml, as the Nox
          workflow does.
        required: false
        type: string
        default: ""
      aggregate-ansible-core:
        description: ansible-core version used for the aggregation job.
        required: false
        type: string
        default: "2.21"
      coverage-thresholds:
        description: "Coverage thresholds for CodeCoverageSummary: '<warn> <ok>'."
        required: false
        type: string
        default: "60 80"
      service-unavailable-title:
        description: Title used for the service-unavailable CI annotation.
        required: false
        type: string
        default: Service unavailable

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    name: Detect collection namespace/name and ansible-core matrix
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.galaxy.outputs.namespace }}
      name: ${{ steps.galaxy.outputs.name }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out collection
        uses: actions/checkout@v7

      - name: Read namespace/name from galaxy.yml
        id: galaxy
        run: |
          namespace=$(grep -m1 '^namespace:' galaxy.yml | awk '{print $2}')
          name=$(grep -m1 '^name:' galaxy.yml | awk '{print $2}')
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Same derivation as reusable-nox.yml's detect job: requires_ansible is
      # a range (e.g. ">=2.16.0"), and its first X.Y is the floor. Testing
      # below it would exercise releases the collection doesn't support.
      - name: Drop matrix entries below requires_ansible
        id: matrix
        env:
          OVERRIDE: ${{ inputs.min-ansible-core }}
          MATRIX: ${{ inputs.ansible-core-matrix }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            floor="$OVERRIDE"
          else
            requires=$(sed -n 's/^requires_ansible:[[:space:]]*//p' meta/runtime.yml \
              | tr -d "'\"" | head -n1)
            # `|| true`: under the runner's pipefail, a grep that matches
            # nothing would otherwise abort the step before it can report why.
            floor=$(echo "$requires" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || true)
            if [ -z "$floor" ]; then
              echo "::error::Could not derive a minimum ansible-core version from meta/runtime.yml (requires_ansible: '${requires}')."
              exit 1
            fi
          fi
          # jq compares arrays element by element, so [2,9] < [2,16].
          matrix=$(jq -c --arg floor "$floor" \
            '[.[] | select((.ansible | split(".") | map(tonumber)) >= ($floor | split(".") | map(tonumber)))]' \
            <<<"$MATRIX")
          if [ "$matrix" = "[]" ]; then
            echo "::error::No ansible-core-matrix entry is at or above the minimum ansible-core ${floor}."
            exit 1
          fi
          echo "Minimum ansible-core ${floor}; testing against: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  coverage:
    needs: detect
    name: Coverage ${{ matrix.ansible }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out collection
        uses: actions/checkout@v7
        with:
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible }}
        run: python -m pip install "ansible-core~=${{ matrix.ansible }}.0"

      - name: Display Ansible Test Version
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}
        run: ansible-test --version

      - name: Run unit tests with coverage
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}
        run: ansible-test units --coverage --docker -v --requirements

      # Run without --color so the teed log greps cleanly. An empty
      # integration-target runs the whole suite.
      - name: Run integration tests with coverage
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}
        env:
          TARGET: ${{ inputs.integration-target }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # TARGET is intentionally word-split (may be empty)
          ansible-test integration ${TARGET} --coverage --docker -v --requirements \
            2>&1 | tee "${RUNNER_TEMP}/integration.log"

      # The setup_<name> role prints this marker when the live service is
      # unreachable; a debug/assert message is not emitted at column 0 and so
      # is never parsed as a workflow command, hence the marker-token bridge.
      - name: Surface service-availability warning
        id: service-warning
        if: always()
        env:
          TITLE: ${{ inputs.service-unavailable-title }}
        run: |
          log="${RUNNER_TEMP}/integration.log"
          if [ -f "$log" ] && grep -aq 'SETUP_SERVICE_UNAVAILABLE' "$log"; then
            echo "::warning title=${TITLE}::Live integration tests skipped (service unreachable)."
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-ansible${{ matrix.ansible }}-py${{ matrix.python }}
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}/tests/output/coverage/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: [detect, coverage]
    if: always()
    name: Aggregate coverage and generate finalized report
    runs-on: ubuntu-latest
    steps:
      - name: Check out collection
        uses: actions/checkout@v7
        with:
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: python -m pip install "ansible-core~=${{ inputs.aggregate-ansible-core }}.0"

      # Pattern-based downloads never fail on zero matches (unlike a
      # name-based download): if every matrix leg failed before uploading,
      # this step still succeeds with nothing downloaded, and the coverage
      # generation steps below run against empty data rather than blocking
      # this always-run job.
      - name: Download coverage data from all matrix legs
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}/tests/output/coverage
          merge-multiple: true

      - name: Generate aggregated coverage report
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}
        run: |
          ansible-test coverage report --requirements
          ansible-test coverage xml --requirements
          ansible-test coverage html --requirements

      # Written into the HTML report directory so it gets published to Pages
      # alongside it (at /coverage/coverage-badge.json), and read by the
      # "Coverage Report" shields.io endpoint badge in README.md. Thresholds
      # match the CodeCoverageSummary step below.
      - name: Generate coverage badge data
        id: badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}
        env:
          THRESHOLDS: ${{ inputs.coverage-thresholds }}
        run: |
          python3 <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          warn, ok = (float(v) for v in os.environ["THRESHOLDS"].split())
          line_rate = float(ET.parse("tests/output/reports/coverage.xml").getroot().attrib["line-rate"])
          pct = round(line_rate * 100, 1)
          color = "red" if pct < warn else "yellow" if pct < ok else "brightgreen"

          with open("tests/output/reports/coverage/coverage-badge.json", "w") as f:
              json.dump(
                  {"schemaVersion": 1, "label": "coverage", "message": f"{pct}%", "color": color},
                  f,
              )
          PY

      # Uploaded unconditionally (not just on pushes to main): reusable-docs's
      # docs job waits on this artifact for every push/PR to generate a
      # native coverage summary page for that exact commit, even though the
      # report itself is only ever deployed to GitHub Pages from main - see
      # the deploy-pages/per-PR-preview note on the PR comment step below.
      # The Docs workflow's deploy job also fetches this same artifact (via
      # the wait-for-workflow-artifact composite action) and combines it
      # with the docsite into a single Pages deployment, with the coverage
      # report nested under /coverage/.
      - name: Upload HTML coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}/tests/output/reports/coverage
          if-no-files-found: error
          retention-days: 1

      - name: Parse Coverage Summary
        id: coverage_summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ansible_collections/${{ needs.detect.outputs.namespace }}/${{ needs.detect.outputs.name }}/tests/output/reports/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: ${{ inputs.coverage-thresholds }}

      # Coverage is only published to GitHub Pages from main, since
      # deploy-pages has no per-PR preview support (it's alpha-only, not
      # generally available), so this links to main's deployed report
      # rather than a per-PR one.
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            ### 📊 Ansible Test Coverage Report
            {{{content}}}

            🔗 **[View the interactive coverage report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)**
            (reflects the latest merge to `main`, not this branch)
          path: code-coverage-results.md
          recreate: true

  # A single fixed-name check for branch protection to require. The matrix
  # legs have version-specific names, and `aggregate` deliberately runs
  # `if: always()` and can succeed even when a leg's tests failed - it only
  # fails below the coverage threshold. So neither reflects "all tests passed".
  # This gate does, and runs `if: always()` itself because a skipped job counts
  # as passing a required check.
  result:
    name: Coverage result
    needs: [detect, coverage, aggregate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every test leg and the aggregate passed
        id: gate
        env:
          DETECT: ${{ needs.detect.result }}
          COVERAGE: ${{ needs.coverage.result }}
          AGGREGATE: ${{ needs.aggregate.result }}
        run: |
          echo "detect: ${DETECT}  coverage: ${COVERAGE}  aggregate: ${AGGREGATE}"
          for r in "$DETECT" "$COVERAGE" "$AGGREGATE"; do
            if [ "$r" != "success" ]; then
              echo "::error title=Coverage failed::detect=${DETECT}, coverage=${COVERAGE}, aggregate=${AGGREGATE}."
              exit 1
            fi
          done
