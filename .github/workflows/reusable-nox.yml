name: Reusable Nox

# Runs all of the collection's antsibull-nox sessions, through antsibull-nox's
# two reusable workflows - the same arrangement community.sops uses:
#
#   - `extra`: reusable-nox-run.yml runs every *default* session - lint,
#     docs-check, license-check, extra-checks, build-import-check - in one job.
#   - `nox`: reusable-nox-matrix.yml runs the ansible-test sessions (sanity,
#     units, and any enabled integration/EE), one job per ansible-core x
#     Python pair.
#
# The two do not overlap because the ansible-test sessions are left at
# antsibull-nox's own `default = false`: the matrix workflow runs them
# regardless, and marking them default would make `extra` re-run the whole
# matrix sequentially.
#
# The final `result` job is the fixed-name check branch protection requires.
#
# Called by a collection repo's own .github/workflows/nox.yml, e.g.
#
#   jobs:
#     nox:
#       uses: SilexDataTeam/silexdata.collection_skeleton/.github/workflows/reusable-nox.yml@v1
#
# min-ansible-core is derived from the caller's meta/runtime.yml at run time
# rather than hardcoded, so bumping requires_ansible there is all a collection
# needs to do to move its floor.
on:
  workflow_call:
    inputs:
      min-ansible-core:
        description: >-
          Override the minimum ansible-core version. Leave unset to derive it
          from the collection's meta/runtime.yml requires_ansible.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  detect:
    name: Detect minimum ansible-core and check the nox config
    runs-on: ubuntu-latest
    outputs:
      min_ansible_core: ${{ steps.runtime.outputs.min_ansible_core }}
    steps:
      - name: Check out collection
        uses: actions/checkout@v7

      # requires_ansible is a version *range* (e.g. ">=2.14.0"); antsibull-nox
      # wants a bare "X.Y" floor, so strip the operator and any patch level.
      - name: Read requires_ansible from meta/runtime.yml
        id: runtime
        env:
          OVERRIDE: ${{ inputs.min-ansible-core }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "min_ansible_core=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          requires=$(sed -n 's/^requires_ansible:[[:space:]]*//p' meta/runtime.yml \
            | tr -d "'\"" | head -n1)
          # `|| true` guards against `shell: bash` ever being set here: it adds
          # pipefail (the default shell does not), and a grep that matches
          # nothing would then abort before the error below.
          floor=$(echo "$requires" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$floor" ]; then
            echo "::error::Could not derive a minimum ansible-core version from meta/runtime.yml (requires_ansible: '${requires}')."
            exit 1
          fi
          echo "Derived min-ansible-core=${floor} from requires_ansible: ${requires}"
          echo "min_ansible_core=${floor}" >> "$GITHUB_OUTPUT"

      # The nox job below runs these sessions as a matrix, and the extra job
      # runs every *default* session, so one marked default would run the whole
      # ansible-test matrix a second time, one version after another. They are
      # all default = false in antsibull-nox itself, so only an explicit
      # `default = true` in antsibull-nox.toml does it. Read as TOML, not grep.
      # tomllib needs Python 3.11+; pin it rather than rely on the runner image.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Refuse matrix sessions that are marked default
        id: nox-config
        env:
          CONFIG: antsibull-nox.toml
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          MATRIX_SESSIONS = (
              "ansible_test_sanity",
              "ansible_test_units",
              "ansible_test_integration_w_default_container",
              "ansible_test_integration",
              "ee_check",
          )
          config = os.environ["CONFIG"]
          with open(config, "rb") as fh:
              sessions = tomllib.load(fh).get("sessions", {})
          defaults = [
              name for name in MATRIX_SESSIONS
              if sessions.get(name, {}).get("default") is True
          ]
          for name in defaults:
              print(
                  f"::error file={config},title=Matrix session marked default::"
                  f"[sessions.{name}] sets default = true. The Nox workflow already runs it "
                  "as a matrix, and would run it again in the extra-sessions job. Set "
                  "default = false; run it locally with `nox -e` instead."
              )
          sys.exit(1 if defaults else 0)
          PY

      # A collection with sanity ignore files keeps one per ansible-core
      # version, and ansible-test only reads the one for its own version. When
      # the matrix gains a new version, its file is easy to forget, and sanity
      # then reports the underlying errors rather than the missing file. So
      # fail early, naming the file, when the newest version the matrix tests
      # has no ignore file but the version below it does. That pattern means
      # "not carried forward"; ignore files only for old versions are normal.
      # The opt-in devel and milestone sessions are left out.
      - name: Install nox to list the sanity matrix
        run: python -m pip install --quiet nox antsibull-nox

      - name: Refuse a sanity ignore file not carried to the newest ansible-core
        id: sanity-ignores
        env:
          IGNORES: tests/sanity
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          folder = pathlib.Path(os.environ["IGNORES"])
          ignores = {p.name[len("ignore-"):-len(".txt")] for p in folder.glob("ignore-*.txt")}
          if not ignores:
              print("No sanity ignore files, so none to carry forward.")
              sys.exit(0)
          listing = subprocess.run(
              ["nox", "--list"], capture_output=True, text=True, check=True
          ).stdout
          tested = sorted(
              set(re.findall(r"^[-*] ansible-test-sanity-(\d+\.\d+)\b", listing, re.M)),
              key=lambda v: tuple(int(n) for n in v.split(".")),
          )
          if len(tested) < 2:
              sys.exit(0)
          previous, newest = tested[-2], tested[-1]
          if newest not in ignores and previous in ignores:
              # A REUSE-compliant collection licenses the file in a sidecar.
              sidecar = (folder / f"ignore-{previous}.txt.license").exists()
              print(
                  f"::error file={folder}/ignore-{previous}.txt,title=Sanity ignore file missing::"
                  f"The sanity matrix tests ansible-core {newest}, which has no {folder}/ignore-{newest}.txt, "
                  f"but {previous} has one, and ansible-test only reads its own version's file. If "
                  f"ignore-{previous}.txt's exceptions still apply, copy it to ignore-{newest}.txt"
                  + (f", and its .license sidecar to ignore-{newest}.txt.license." if sidecar else ".")
              )
              sys.exit(1)
          print(f"Sanity ignore files are carried forward to ansible-core {newest}.")
          PY

  extra:
    # Waits on detect so a misconfigured antsibull-nox.toml stops it too,
    # rather than letting it run the duplicated matrix anyway.
    needs: detect
    uses: ansible-community/antsibull-nox/.github/workflows/reusable-nox-run.yml@stable-1
    with:
      session-name: Run extra sanity tests

  nox:
    needs: detect
    uses: ansible-community/antsibull-nox/.github/workflows/reusable-nox-matrix.yml@stable-1
    with:
      min-ansible-core: ${{ needs.detect.outputs.min_ansible_core }}

  # A single fixed-name check that reflects whether *every* nox session passed,
  # for branch protection to require. The antsibull-nox matrix jobs have
  # dynamic names (they encode the ansible-core version), so requiring them
  # individually breaks whenever the matrix changes; and its only fixed-name
  # job, upload-coverage, runs only when Codecov upload is enabled. GitHub
  # reports a *skipped* job as passing a required check, so the gate must run
  # `if: always()` and fail explicitly - otherwise a failed session would
  # leave it skipped, and the PR mergeable.
  result:
    name: Nox result
    needs: [detect, extra, nox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every nox session passed
        id: gate
        env:
          DETECT: ${{ needs.detect.result }}
          EXTRA: ${{ needs.extra.result }}
          NOX: ${{ needs.nox.result }}
        run: |
          echo "detect: ${DETECT}  extra: ${EXTRA}  nox: ${NOX}"
          for r in "$DETECT" "$EXTRA" "$NOX"; do
            if [ "$r" != "success" ]; then
              echo "::error title=Nox failed::One or more nox sessions did not succeed (detect=${DETECT}, extra=${EXTRA}, nox=${NOX})."
              exit 1
            fi
          done
