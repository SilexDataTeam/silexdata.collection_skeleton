---
# SPDX-FileCopyrightText: Silex Data Solutions
# SPDX-License-Identifier: Apache-2.0
name: Wait for workflow run and download artifact
description: >-
  Waits for another workflow's run for a specific commit to complete, then
  downloads a named artifact from it. Used to stitch artifacts together
  across independent workflows triggered by the same push (e.g. combining a
  docs site and a coverage report into one GitHub Pages deployment) without
  racing that other workflow's completion or falling back to a stale run.
inputs:
  workflow:
    description: Workflow file name to search (e.g. coverage.yml).
    required: true
  head-sha:
    description: Commit SHA the target workflow run must have been triggered by.
    required: true
  artifact-name:
    description: Name of the artifact to download.
    required: true
  path:
    description: Destination directory for the downloaded artifact.
    required: true
  github-token:
    description: Token used to query the Actions API and download the artifact.
    required: true
  timeout-minutes:
    description: How long to wait for the run to complete before giving up.
    required: false
    default: "20"
  poll-interval-seconds:
    description: How often to re-check the run's status while waiting.
    required: false
    default: "30"
runs:
  using: composite
  steps:
    # The choice between several runs for the commit lives in select-run.js,
    # shipped alongside this file (reached through github.action_path), so
    # selftest can exercise it without the Actions API.
    - name: Wait for ${{ inputs.workflow }} run on ${{ inputs.head-sha }}
      id: find_run
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKFLOW: ${{ inputs.workflow }}
        HEAD_SHA: ${{ inputs.head-sha }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { selectRun } = require(`${process.env.ACTION_PATH}/select-run.js`);
          const workflow_id = process.env.WORKFLOW;
          const head_sha = process.env.HEAD_SHA;
          const deadline =
            Date.now() + Number(process.env.TIMEOUT_MINUTES) * 60 * 1000;
          const pollMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;

          let choice;
          for (;;) {
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              head_sha,
              per_page: 20,
            });
            choice = selectRun(data.workflow_runs);
            if (choice.action !== "wait") {
              break;
            }
            const run = choice.run;
            if (Date.now() >= deadline) {
              core.setFailed(
                run
                  ? `Timed out waiting for ${workflow_id} run ${run.id} ` +
                    `(commit ${head_sha}) to complete; last status: ${run.status}.`
                  : `Timed out waiting for a run of ${workflow_id} for ` +
                    `commit ${head_sha} to appear.`
              );
              return;
            }
            core.info(
              `Waiting on ${workflow_id} for commit ${head_sha} ` +
              (run ? `(run ${run.id}, status: ${run.status})...` : "(status: not started)...")
            );
            await new Promise((resolve) => setTimeout(resolve, pollMs));
          }

          const run = choice.run;
          if (choice.action === "fail") {
            core.setFailed(
              `${workflow_id} run ${run.id} for commit ${head_sha} finished ` +
              `with conclusion "${run.conclusion}", not "success".`
            );
            return;
          }

          core.info(`Using ${workflow_id} run ${run.id} for commit ${head_sha}.`);
          core.setOutput("run_id", run.id);

    - name: Download ${{ inputs.artifact-name }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}
        github-token: ${{ inputs.github-token }}
        run-id: ${{ steps.find_run.outputs.run_id }}
